<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kraken arena layers</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#080e1b;color:#e5f2f6;font:15px system-ui}main{max-width:1400px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{color:#a8becd;margin:0 0 18px}.controls{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px}label{cursor:pointer}.stage{position:relative;width:100%;aspect-ratio:1672/941;background:repeating-conic-gradient(#192435 0% 25%,#121b29 0% 50%) 0/24px 24px;overflow:hidden;border:1px solid #345263;border-radius:8px}.stage img{position:absolute;pointer-events:none;image-rendering:pixelated;user-select:none}.full{inset:0;width:100%;height:100%}.creature{image-rendering:auto!important;width:43%;height:auto;right:3%;bottom:19%}footer{margin-top:16px;font-size:13px;color:#a8becd}a{color:#7ddcdb}
</style><main><h1>Kraken · moonlit ship arena</h1><p>Separate PNG layers. Toggle each layer to inspect its transparency and placement.</p>
<div class="controls"><label><input type="checkbox" checked data-layer="background"> Background</label><label><input type="checkbox" checked data-layer="platform"> Ship platform</label><label><input type="checkbox" checked data-layer="kraken"> Kraken</label><label><input type="checkbox" checked data-layer="foreground"> Foreground</label></div>
<div class="stage" aria-label="Layered Kraken battle arena"><img id="background" class="full" src="background.png" alt="Moonlit ocean backdrop"><img id="platform" class="full" src="ship-platform.png" alt="Wooden ship battle platform"><img id="kraken" class="creature" src="kraken-clean-v2.png" alt="Armored purple Kraken with glowing teal suckers"><img id="foreground" class="full" src="foreground.png" alt="Foreground waves"></div>
<footer>Draw order: background → platform → heroes and boss → foreground. <a href="README.md">Placement notes</a> · <a href="prompts.json">Generation prompts</a></footer></main>
<script>document.querySelectorAll('[data-layer]').forEach(input=>input.addEventListener('change',()=>{document.getElementById(input.dataset.layer).hidden=!input.checked;}));</script></html>
