<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stillwater fish artwork</title><style>body{margin:0;padding:30px;background:#102f2b;color:#f2ead5;font-family:Georgia,serif}main{max-width:1180px;margin:auto}h1{font-size:32px;font-weight:normal;margin:0 0 8px}p{font:14px/1.6 system-ui;color:#b7cabc}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}article{border:1px solid #476b60;border-radius:14px;padding:18px;background:#1d4039}h2{font-size:22px;font-weight:normal;margin:0 0 10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0}img{display:block;width:100%;aspect-ratio:2;object-fit:contain}figcaption{font:12px system-ui;text-align:center;color:#ccdbcf;margin-top:6px}@media(max-width:650px){body{padding:20px}.grid{grid-template-columns:1fr}}</style><main><h1>Stillwater fish artwork</h1><p>Eight freshwater species, with normal and albino paintings. Albino colors are reconstructed where a reliable species reference was unavailable.</p><div class="grid"><article><h2>Bluegill</h2><div class="pair"><figure><img src="bluegill-painted.png" alt="Bluegill (Lepomis macrochirus), normal colors"><figcaption>Normal</figcaption></figure><figure><img src="bluegill-albino-painted.png" alt="Bluegill (Lepomis macrochirus), albino colors"><figcaption>Albino</figcaption></figure></div></article><article><h2>Yellow perch</h2><div class="pair"><figure><img src="perch-painted.png" alt="Yellow perch (Perca flavescens), normal colors"><figcaption>Normal</figcaption></figure><figure><img src="perch-albino-painted.png" alt="Yellow perch (Perca flavescens), albino colors"><figcaption>Albino</figcaption></figure></div></article><article><h2>Black crappie</h2><div class="pair"><figure><img src="crappie-painted.png" alt="Black crappie (Pomoxis nigromaculatus), normal colors"><figcaption>Normal</figcaption></figure><figure><img src="crappie-albino-painted.png" alt="Black crappie (Pomoxis nigromaculatus), albino colors"><figcaption>Albino</figcaption></figure></div></article><article><h2>Largemouth bass</h2><div class="pair"><figure><img src="bass-painted.png" alt="Largemouth bass (Micropterus salmoides), normal colors"><figcaption>Normal</figcaption></figure><figure><img src="bass-albino-painted.png" alt="Largemouth bass (Micropterus salmoides), albino colors"><figcaption>Albino</figcaption></figure></div></article><article><h2>Walleye</h2><div class="pair"><figure><img src="walleye-painted.png" alt="Walleye (Sander vitreus), normal colors"><figcaption>Normal</figcaption></figure><figure><img src="walleye-albino-painted.png" alt="Walleye (Sander vitreus), albino colors"><figcaption>Albino</figcaption></figure></div></article><article><h2>Northern pike</h2><div class="pair"><figure><img src="pike-painted.png" alt="Northern pike (Esox lucius), normal colors"><figcaption>Normal</figcaption></figure><figure><img src="pike-albino-painted.png" alt="Northern pike (Esox lucius), albino colors"><figcaption>Albino</figcaption></figure></div></article><article><h2>Muskellunge</h2><div class="pair"><figure><img src="muskie-painted.png" alt="Muskellunge (Esox masquinongy), normal colors"><figcaption>Normal</figcaption></figure><figure><img src="muskie-albino-painted.png" alt="Muskellunge (Esox masquinongy), albino colors"><figcaption>Albino</figcaption></figure></div></article><article><h2>Lake sturgeon</h2><div class="pair"><figure><img src="sturgeon-painted.png" alt="Lake sturgeon (Acipenser fulvescens), normal colors"><figcaption>Normal</figcaption></figure><figure><img src="sturgeon-albino-painted.png" alt="Lake sturgeon (Acipenser fulvescens), albino colors"><figcaption>Albino</figcaption></figure></div></article></div></main></html>
