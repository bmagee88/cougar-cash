  top: calc((1 - var(--cover-at)) * var(--cover-far-y, 67.75%) + var(--cover-at) * var(--cover-near-y, 88%) + .675%);
  width: clamp(28px, calc(3.4vw * var(--cover-scale)), 64px); aspect-ratio: 1273 / 1236;
  transform: translate(-50%, -94%); opacity: .86; transition: opacity .25s ease;
}

.f-page-removed { display:flex; align-items:center; gap:10px; font-size:12px; }
@media(hover:none) { .f-page-tear { stroke-dashoffset:0; } }
@media(prefers-reduced-motion:reduce) { .f-page-ripping { animation-duration:.01ms; } }
/* A real editable target allows iOS/Android to open their software keyboard. */
@media(pointer:coarse), (max-width:700px) {
 .f-keyboard-input { position:relative; width:100%; box-sizing:border-box; height:38px; padding:7px 10px; margin-top:12px; left:auto; bottom:auto; opacity:1; border:1px solid #b4cab96b; border-radius:6px; background:#062c28; color:#f2ead5; font-size:16px; }
 .f-keyboard-input::placeholder { color:#c5d3be; }
 .f-lake-typing .f-scene-heading, .f-lake-retrieving .f-scene-heading { visibility:hidden; }
 .f-lake-typing .f-challenge, .f-lake-retrieving .f-challenge { top:62px; max-height:calc(100% - 76px); overflow-y:auto; overscroll-behavior:contain; }
 .f-lake-retrieving .f-weather-label { visibility:hidden; }
}

/* Cover/crop the panoramic art, never stretch it into a phone's aspect ratio.
   The bank, dock and seated rig use one shared, bottom-anchored coordinate system. */
.f-scene { container-type:size; --ground-width:max(100cqw, min(1100px, 140cqh)); --ground-height:calc(var(--ground-width) / 2); --ground-left:calc(26cqw - var(--ground-width) * .254); }
.f-travel-art .f-scene { --ground-width:100cqw; }
.f-scene-layer { object-fit:contain; }
.f-backdrop-content { object-fit:fill; }
.f-spot-cove [data-layer="cove-seat"] { object-fit:contain; }

/* Desktop foreground has its own scale and framing. The phone composition
   above stays independent; background panorama sizing is shared unchanged. */
@media(min-width:701px) {
 .f-scene {
  --ground-width:min(76cqw,120cqh,1040px);
  --ground-left:calc(24cqw - var(--ground-width) * .254);
  --reeds-width:min(76cqw,112cqh,1120px);
  --reeds-left:-2%; --reeds-right:-2%;
  --reeds-left-clip:inset(0 50% 0 0); --reeds-right-clip:inset(0 0 0 50%); --reeds-right-display:block;
  --right-bank-width:min(20cqw,44cqh);
  --cove-ground-left:-5cqw;
  --cove-character-scale:.68;
  --cove-willow-left-width:min(50cqw,96cqh); --cove-willow-left-min:0px;
  --cove-willow-right-width:min(36cqw,68cqh); --cove-willow-right-min:0px;
  --cove-willow-right-left:auto; --cove-willow-right-right:-4%;
 }
 .f-cove-ground-plane { --cove-ground-width:var(--cove-cover-width); }
 .f-travel-art .f-scene { --ground-width:100cqw; }
 .f-travel-art .f-cove-ground-plane { --cove-ground-width:100cqw; --cove-ground-left:0px; }
}

.f-butterfly-visitors { display:contents; }
.f-butterfly-visit { position:absolute; left:-20%; top:50%; padding:0; border:0; border-radius:0; background:transparent; pointer-events:auto; transform:translate(-50%,-50%); filter:var(--foreground-filter); transition:filter 8s ease; will-change:left,top,width,height; touch-action:manipulation; }
.f-butterfly-visit:disabled { pointer-events:none; }
.f-butterfly-visit canvas { display:block; width:100%; height:100%; pointer-events:none; }
.f-reduced-motion .f-butterfly-visitors { display:none; }
.f-santa-visit { position:absolute; z-index:5; left:-35%; top:15%; width:var(--sky-moon-size); aspect-ratio:16/7; padding:0; border:0; background:none; transform:translate(-50%,-50%); touch-action:manipulation; cursor:pointer; }
.f-santa-visit canvas { display:block; width:100%; height:100%; pointer-events:none; }
.f-santa-visit:disabled { pointer-events:none; }
.f-santa-visit:focus-visible,.f-butterfly-visit:focus-visible { outline:2px solid #f3d795; outline-offset:3px; }
/* Painted near birds and original distant silhouettes share the same routes. */
.f-tree-birds { position:absolute; inset:0; pointer-events:none; }
.f-tree-bird-frame { position:absolute; }
.f-tree-bird { position:absolute; left:0; top:0; z-index:4; display:block; width:clamp(6px,.6cqw,9px); height:clamp(6px,.6cqw,9px); filter:brightness(calc(var(--time-brightness,1) * var(--weather-brightness,1))); animation:f-tree-bird-flight var(--bird-duration) linear both; animation-delay:var(--bird-delay); }

.f-tree-bird-species,.f-tree-bird-cruise { position:absolute; inset:0; display:block; }
.f-tree-bird-species { width:100%; height:100%; padding:0; border:0; background:none; pointer-events:auto; cursor:pointer; touch-action:manipulation; }
.f-tree-bird-species::after { content:''; position:absolute; inset:-5px; }

.f-tree-bird-wingbeat { animation:f-tree-bird-wingbeat .4s step-end infinite,f-tree-bird-flapping var(--bird-bound-period) step-end infinite; animation-delay:var(--bird-species-phase),var(--bird-species-phase); }
.f-tree-bird-glide { background-position-x:72.727273%; animation:f-tree-bird-gliding var(--bird-bound-period) step-end infinite; animation-delay:var(--bird-species-phase); }
.f-tree-bird-species[data-bird-landing="true"] .f-tree-bird-cruise { animation:f-tree-bird-cruise var(--bird-duration) step-end both; animation-delay:var(--bird-delay); }
.f-tree-bird-brake { animation:f-tree-bird-brake var(--bird-duration) step-end both; animation-delay:var(--bird-delay); }
@keyframes f-tree-bird-wingbeat { 0% { background-position-x:0%; } 12.5% { background-position-x:9.090909%; } 25% { background-position-x:18.181818%; } 37.5% { background-position-x:27.272727%; } 50% { background-position-x:36.363636%; } 62.5% { background-position-x:45.454545%; } 75% { background-position-x:54.545455%; } 87.5%,100% { background-position-x:63.636364%; } }
@keyframes f-tree-bird-flapping { 0%,100% { opacity:1; } 65% { opacity:0; } }
@keyframes f-tree-bird-gliding { 0%,100% { opacity:0; } 65% { opacity:1; } }
@keyframes f-tree-bird-cruise { 0% { opacity:1; } 80%,100% { opacity:0; } }
@keyframes f-tree-bird-brake { 0% { opacity:0; background-position-x:81.818182%; } 80% { opacity:1; background-position-x:81.818182%; } 86% { opacity:1; background-position-x:90.909091%; } 92%,100% { opacity:1; background-position-x:100%; } }

.f-reduced-motion .f-tree-birds { display:none; }
.f-tree-map { position:absolute; inset:0; z-index:19; pointer-events:none; }
.f-tree-map > div { position:absolute; transform:translate3d(calc(var(--scene-x,0px) * .02),0,0); }
.f-tree-map svg { display:block; width:100%; height:100%; overflow:visible; }
.f-tree-map line,.f-tree-map circle { stroke:#f9f4b4; stroke-width:1.5; fill:#123d35; vector-effect:non-scaling-stroke; }
.f-tree-map rect { fill:#f8da5d44; stroke:#f8da5d; stroke-width:.7; stroke-dasharray:3 2; }
.f-tree-map [data-tree-kind="bush"] rect { fill:#70edb244; stroke:#70edb2; }
.f-tree-map text { font:9px monospace; fill:#fffbd7; stroke:#132a25; stroke-width:2px; paint-order:stroke; }
/* Birch Point's full-canvas cutouts share one frame, including the close trunks.
   Cover the viewport without stretching the rock ledge or enlarging the angler. */
.f-spot-birch [data-layer^="birch-"] { object-fit:fill; }

 .f-travel-art .f-spot-birch .f-cove-ground-plane { --cove-ground-width:100cqw; }
